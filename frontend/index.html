<!DOCTYPE html>
<html>
<head>
  <title>Smart Parking Dashboard</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f8;
    }

    h1 {
      margin-top: 20px;
    }

    .summary {
      margin: 20px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 150px);
      gap: 20px;
      justify-content: center;
    }

    .slot {
      height: 120px;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: 0.3s;
    }

    .FREE {
      background: #2ecc71;
    }

    .OCCUPIED {
      background: #e74c3c;
    }

    .timestamp {
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>🚗 Smart Parking System</h1>

<div class="summary" id="summary"></div>

<div class="grid" id="slots"></div>

<script>
async function fetchSlots(){
  let res = await fetch('http://127.0.0.1:5000/slots');
  let data = await res.json();

  let html = '';
  let occupied = 0;

  data.forEach(slot => {
    if(slot.status === "OCCUPIED") occupied++;

    html += `
      <div class="slot ${slot.status}">
        ${slot.slot_number}
        <div>${slot.status}</div>
        <div class="timestamp">${new Date(slot.last_updated).toLocaleTimeString()}</div>
      </div>
    `;
  });

  document.getElementById('slots').innerHTML = html;

  document.getElementById('summary').innerHTML =
    `${occupied} / ${data.length} slots occupied | ${data.length - occupied} available`;
}

setInterval(fetchSlots, 1000);
fetchSlots();
</script>

</body>
</html>
