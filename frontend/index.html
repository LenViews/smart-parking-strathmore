
<!DOCTYPE html>
<html>
<head>
  <title>Smart Parking Dashboard</title>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f8;
    }

    h1 { margin-top: 20px; }

    .top-bar { margin: 20px; }

    button {
      margin-top: 5px;
      padding: 8px;
      cursor: pointer;
    }

    .parking-lot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      padding: 30px;
    }

    .row {
      display: flex;
      gap: 35px;
      justify-content: center;
    }

    .slot {
      width: 90px;
      height: 150px;
      border-radius: 10px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(45deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .slot-content {
      transform: rotate(-45deg);
      text-align: center;
      font-size: 12px;
    }

    .FREE { background: #2ecc71; }
    .RESERVED { background: #f39c12; }
    .OCCUPIED { background: #e74c3c; }

    .lane {
      width: 45%;
      height: 80px;
      background: #bdc3c7;
      border-radius: 10px;
      margin: 10px auto;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }

    .summary {
      font-weight: bold;
      margin: 10px;
    }
  </style>
</head>

<body>

<h1>🚗 Smart Parking System</h1>

<p>Welcome! Please login to reserve parking slots.</p>

<div class="top-bar">
  <a href="auth.html">
    <button>Login / Register</button>
  </a>
</div>

<div id="summary" class="summary"></div>

<div class="parking-lot" id="slots"></div>

<h2>Gate Simulation</h2>

<input id="plate" placeholder="Plate Number">
<br><br>

<button onclick="entry()">Entry</button>
<button onclick="exitVehicle()">Exit</button>

<script>

const slotsEl = document.getElementById("slots");
const summaryEl = document.getElementById("summary");
const plateInput = document.getElementById("plate");

const socket = io("http://127.0.0.1:5000");
const API = "http://127.0.0.1:5000";

socket.on("slots_updated", fetchSlots);

/* ===== ENTRY ===== */
async function entry() {
  const res = await fetch(API + "/entry", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ plate: plateInput.value })
  });

  const data = await res.json();
  alert(data.message);
}

/* ===== EXIT ===== */
async function exitVehicle() {
  const res = await fetch(API + "/exit", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ plate: plateInput.value })
  });

  const data = await res.json();
  alert(data.message);
}

/* ===== FETCH SLOTS ===== */
async function fetchSlots() {
  const res = await fetch(API + "/slots");
  const data = await res.json();

  let occupied = 0;

  const mid = Math.ceil(data.length / 2);
  const row1 = data.slice(0, mid);
  const row2 = data.slice(mid);

  function renderRow(arr) {
    return `
      <div class="row">
        ${arr.map(slot => {
          if (slot.status === "OCCUPIED") occupied++;

          return `
            <div class="slot ${slot.status}">
              <div class="slot-content">
                <b>${slot.slot_number}</b><br>
                ${slot.status}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  slotsEl.innerHTML = `
    ${renderRow(row1)}
    <div class="lane"></div>
    ${renderRow(row2)}
  `;

  summaryEl.innerText = `${occupied}/${data.length} occupied`;
}

fetchSlots();

</script>

</body>
</html>
