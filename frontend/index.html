<!DOCTYPE html>
<html>
<head>
  <title>Smart Parking Dashboard</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f8;
    }

    h1 {
      margin-top: 20px;
    }

    .summary {
      margin: 20px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 150px);
      gap: 20px;
      justify-content: center;
    }

    .slot {
      height: 120px;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: 0.3s;
    }

    .FREE {
      background: #2ecc71;
    }

    .RESERVED {
      background: #f39c12;
    }

    .OCCUPIED {
      background: #e74c3c;
    }

    .timestamp {
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>🚗 Smart Parking System</h1>

<h2>Login</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<p id="userInfo"></p>

<div class="summary" id="summary"></div>

<div class="grid" id="slots"></div>

<h2>Gate Simulation</h2>

<input id="plate" placeholder="Enter Plate Number">
<br><br>

<button onclick="entry()">Entry</button>
<button onclick="exit()">Exit</button>



<script>

let currentUser = null;

async function login(){
  let email = document.getElementById('email').value;
  let password = document.getElementById('password').value;

  let res = await fetch('http://127.0.0.1:5000/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });

  let data = await res.json();

  if(res.ok){
    currentUser = data.user;
    document.getElementById('userInfo').innerText =
      `Logged in as ${currentUser.name} (${currentUser.role})`;
  } else {
    alert(data.message);
  }
}

async function reserve(slotId){
  if(!currentUser){
    alert("Login first");
    return;
  }

  await fetch('http://127.0.0.1:5000/reserve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      slot_id: slotId,
      user: currentUser.name,
      role: currentUser.role
    })
  });
}

async function entry(){
  let plate = document.getElementById('plate').value;

  await fetch('http://127.0.0.1:5000/entry', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({plate})
  });

  alert("Entry logged");
}

async function exit(){
  let plate = document.getElementById('plate').value;

  await fetch('http://127.0.0.1:5000/exit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({plate})
  });

  alert("Exit logged");
}
</script>

<script>
async function fetchSlots(){
  let res = await fetch('http://127.0.0.1:5000/slots');
  let data = await res.json();

  let html = '';
  let occupied = 0;

  data.forEach(slot => {
    if(slot.status === "OCCUPIED") occupied++;

    html += `
      <div class="slot ${slot.status}">
        ${slot.slot_number}
        <div>${slot.status}</div>
        <div class="timestamp">${new Date(slot.last_updated).toLocaleTimeString()}</div>
      </div>
    `;
  });

  document.getElementById('slots').innerHTML = html;

  document.getElementById('summary').innerHTML =
    `${occupied} / ${data.length} slots occupied | ${data.length - occupied} available`;
}

setInterval(fetchSlots, 1000);
fetchSlots();
</script>

</body>
</html>
