
<!DOCTYPE html>
<html>
<head>
  <title>Smart Parking Dashboard</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f8;
    }

    h1 {
      margin-top: 20px;
    }

    .top-bar {
      margin: 20px;
    }

    button {
      margin-top: 5px;
      padding: 8px;
      cursor: pointer;
    }

    /* ===== PARKING LAYOUT ===== */
    .parking-lot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      padding: 30px;
    }

    .row {
      display: flex;
      gap: 35px;
      justify-content: center;
    }

    /* 45° angled slot */
    .slot {
      width: 90px;
      height: 150px;
      border-radius: 10px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(45deg);
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* Fix text rotation */
    .slot-content {
      transform: rotate(-45deg);
      text-align: center;
      font-size: 12px;
    }

    .FREE { background: #2ecc71; }
    .RESERVED { background: #f39c12; }
    .OCCUPIED { background: #e74c3c; }

    /* Driving lane */
    .lane {
      width: 45%;
      height: 80px;
      background: #bdc3c7;
      border-radius: 10px;
      margin: 10px auto;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }

    .summary {
      font-weight: bold;
      margin: 10px;
    }
  </style>
</head>

<body>

<h1>🚗 Smart Parking System</h1>

<p>Welcome! Please login or register to access full features.</p>

<div class="top-bar">
  <a href="auth.html">
    <button>Login / Register</button>
  </a>
</div>

<div id="summary" class="summary"></div>

<!-- ANGLED PARKING LOT -->
<div class="parking-lot" id="slots"></div>

<h2>Gate Simulation</h2>
<input id="plate" placeholder="Plate Number"><br><br>
<button onclick="entry()">Entry</button>
<button onclick="exit()">Exit</button>

<script>
let currentUser = null;
const API = 'http://127.0.0.1:5000';

/* ===== RESERVE ===== */
async function reserve(slotId){
  if(!currentUser) return alert("Login first");

  let res = await fetch(API + '/reserve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      slot_id: slotId,
      user_id: currentUser.id,
      role: currentUser.role
    })
  });

  let data = await res.json();
  alert(data.message);
}

/* ===== RELEASE ===== */
async function release(slotId){
  if(!currentUser) return alert("Login first");

  let res = await fetch(API + '/release', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      slot_id: slotId,
      user_id: currentUser.id,
      role: currentUser.role
    })
  });

  let data = await res.json();
  alert(data.message);
}

/* ===== ENTRY ===== */
async function entry(){
  let res = await fetch(API + '/entry', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({plate: plate.value})
  });

  let data = await res.json();
  alert(data.message);
}

/* ===== EXIT ===== */
async function exit(){
  let res = await fetch(API + '/exit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({plate: plate.value})
  });

  let data = await res.json();
  alert(data.message);
}

/* ===== FETCH + RENDER ANGLED LOT ===== */
async function fetchSlots(){
  let res = await fetch(API + '/slots');
  let data = await res.json();

  let occupied = 0;

  // split into two angled rows
  let mid = Math.ceil(data.length / 2);
  let row1 = data.slice(0, mid);
  let row2 = data.slice(mid);

  function renderRow(slotsArr){
    return `
      <div class="row">
        ${slotsArr.map(slot => {
          if(slot.status === "OCCUPIED") occupied++;

          return `
            <div class="slot ${slot.status}">
              <div class="slot-content">
                <b>${slot.slot_number}</b><br>
                ${slot.status}<br>

                ${slot.status === "FREE" && currentUser ?
                  `<button onclick="reserve(${slot.id})">Reserve</button>` : ''}

                ${slot.status === "RESERVED" && currentUser && currentUser.role === "admin" ?
                  `<button onclick="release(${slot.id})">Release</button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  slots.innerHTML = `
    ${renderRow(row1)}
    <div class="lane"></div>
    ${renderRow(row2)}
  `;

  summary.innerHTML = `${occupied}/${data.length} occupied`;
}

/* ===== AUTO REFRESH ===== */
setInterval(fetchSlots, 1000);
fetchSlots();
</script>

</body>
</html>
