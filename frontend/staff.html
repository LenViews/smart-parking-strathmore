<!DOCTYPE html>
<html>
<head>
<title>Staff Dashboard</title>
</head>
<body>

<h1>👨‍💼 Staff Dashboard</h1>
<button onclick="logout()">Logout</button>

<div id="slots"></div>

<script>
const API = "http://127.0.0.1:5000";
let user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "staff") window.location="index.html";

function logout(){
  localStorage.clear();
  window.location="index.html";
}

async function fetchSlots(){
  let res = await fetch(API+"/slots");
  let data = await res.json();

  let html = "";

  data.forEach(slot=>{
    html += `
      <div>
        ${slot.slot_number} - ${slot.status}
        <button onclick="reserve(${slot.id})">Quick Reserve</button>
      </div>
    `;
  });

  slots.innerHTML = html;
}

async function reserve(id){
  let res = await fetch(API+"/reserve",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      slot_id:id,
      user_id:user.id,
      role:user.role
    })
  });

  alert((await res.json()).message);
}

setInterval(fetchSlots,1000);
</script>

</body>
</html>
