
<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

.section {
  margin: 20px auto;
  width: 80%;
}

.card {
  background: white;
  padding: 12px;
  margin: 8px auto;
  width: 350px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

button {
  padding: 5px;
  margin: 3px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🛠 Admin Control Center</h1>
<button onclick="logout()">Logout</button>
<button onclick="addSlot()">Add Slot</button>
<button onclick="forceFreeAll()">Emergency Reset</button>

<div class="section">
  <h2>Slots</h2>
  <div id="slots">Loading slots...</div>
</div>

<div class="section">
  <h2>System Logs</h2>
  <div id="logs">Loading logs...</div>
</div>

<div class="section">
   <h2>📊 Analytics</h2>
   <div id="analytics"></div> 
</div>

<div class="section">
  <h2>Users</h2>
  <div id="users">Loading users...</div>
</div>

<script>

const API = "http://127.0.0.1:5000";
const socket = io(API);

let user = null;

try {
  user = JSON.parse(localStorage.getItem("user"));
} catch (e) {
  user = null;
}

if (!user || user.role !== "admin") {
  window.location = "index.html";
}

/* ---------------- SOCKET CONNECTION ---------------- */
socket.on("connect", () => {
  console.log("Admin connected");
  loadAll(); // IMPORTANT: initial load after connection
});

socket.on("slots_updated", () => fetchSlots());
socket.on("logs_updated", () => fetchLogs());
socket.on("users_updated", () => fetchUsers());

socket.on("system_warning", (data) => {
  alert("⚠️ " + data.message);
});

/* ---------------- INIT ---------------- */
loadAll();

/* ---------------- LOAD ALL ---------------- */
function loadAll(){
  fetchSlots();
  fetchLogs();
  fetchUsers();
  fetchAnalytics();
}

/* ---------------- LOGOUT ---------------- */
function logout(){
  localStorage.clear();
  window.location = "index.html";
}

/* ---------------- SLOTS ---------------- */
async function fetchSlots(){
  try {
    let res = await fetch(API + "/slots");
    let data = await res.json();

    if (!data.length) {
      document.getElementById("slots").innerHTML = "No slots found";
      return;
    }

    document.getElementById("slots").innerHTML = data.map(slot => `
      <div class="card">
        <b>Slot ${slot.slot_number}</b><br>
        Status: ${slot.status}<br>

        <button onclick="reserve(${slot.id})">Reserve</button>
        <button onclick="release(${slot.id})">Release</button>
        <button onclick="deleteSlot(${slot.id})">Delete</button>
      </div>
    `).join("");

  } catch (err) {
    document.getElementById("slots").innerHTML = "Error loading slots";
  }
}

/* ---------------- ANALYTICS -------------*/
async function fetchAnalytics(){
  let res = await fetch(API + "/analytics");
  let data = await res.json();

  document.getElementById("analytics").innerHTML = `
    <div class="card">
      Occupancy: ${data.occupancy_rate}%<br>
      Slots: ${data.occupied}/${data.total}<br>
      Today Reservations: ${data.today_reservations}
    </div>
  `;
}

/* ---------------- LOGS ---------------- */
async function fetchLogs(){
  try {
    let res = await fetch(API + "/logs");
    let data = await res.json();

    if (!data.length) {
      document.getElementById("logs").innerHTML = "No logs yet";
      return;
    }

    document.getElementById("logs").innerHTML = data.map(l => `
      <div class="card">
        Plate: ${l.vehicle_plate || "N/A"}<br>
        Time: ${l.entry_time || ""}
      </div>
    `).join("");

  } catch (err) {
    document.getElementById("logs").innerHTML = "Error loading logs";
  }
}

/* ------------- AUDIT LOGS ---------------*/
async function fetchAudit(){
  let res = await fetch(API + "/audit_logs");
  let data = await res.json();

  document.getElementById("logs").innerHTML = data.map(l => `
    <div class="card">
      User ${l.user_id} → ${l.action}<br>
      ${l.created_at}
    </div>
  `).join("");
}


/* ---------------- USERS ---------------- */
async function fetchUsers(){
  try {
    let res = await fetch(API + "/users");
    let data = await res.json();

    if (!data.length) {
      document.getElementById("users").innerHTML = "No users found";
      return;
    }

   document.getElementById("users").innerHTML = data.map(u => `
    <div class="card">
        <b>${u.name}</b> (${u.role})<br>

        <button onclick="toggleUser(${u.id})">Toggle Active</button><br>

        <select onchange="changeRole(${u.id}, this.value)">
          <option value="student" ${u.role === "student" ? "selected" : ""}>Student</option>
          <option value="staff" ${u.role === "staff" ? "selected" : ""}>Staff</option>
          <option value="security" ${u.role === "security" ? "selected" : ""}>Security</option>
          <option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option>
        </select>
    </div>
`).join(""); 
  } catch (err) {
    document.getElementById("users").innerHTML = "Error loading users";
  }
}

/* -------------- TOGGLE USER -------------- */
async function toggleUser(id){
  let res = await fetch(API + "/toggle_user", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ user_id: id, admin_id: user_id })
  });

  let data = await res.json();
  alert(data.message);
  fetchUsers();
}

async function changeRole(id, role){
  let res = await fetch(API + "/change_role", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ user_id: id, role: role, admin_id: user_id })
  });

  let data = await res.json();
  alert(data.message);
  fetchUsers();
}


/* ---------------- ACTIONS ---------------- */
async function reserve(id){
  await fetch(API + "/reserve", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      slot_id: id,
      user_id: user.id,
      role: user.role
    })
  });
}

async function release(id){
  await fetch(API + "/release", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      slot_id: id,
      user_id: user.id,
      role: user.role
    })
  });
}

async function addSlot(){
  let res = await fetch(API + "/add_slot", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      user_id: user.id   // for audit logging
    })
  });

  let data = await res.json();
  alert(data.message);
  fetchSlots();
}

async function forceFreeAll(){
  if (!confirm("⚠️ Are you sure you want to reset ALL slots?")) return;

  let res = await fetch(API + "/force_free_all", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      user_id: user.id
    })
  });

  let data = await res.json();
  alert(data.message);
  fetchSlots();
}

async function deleteSlot(id){
  if (!confirm("Delete this slot?")) return;

  let res = await fetch(API + "/delete_slot", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      slot_id: id,
      user_id: user.id
    })
  });

  let data = await res.json();
  alert(data.message);
  fetchSlots();
}

</script>

</body>
</html>
