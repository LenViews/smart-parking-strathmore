
<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  text-align: center;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px auto;
  width: 350px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

button {
  padding: 6px;
  margin-top: 5px;
  cursor: pointer;
}

.free { color: green; }
.reserved { color: orange; }
.occupied { color: red; }
</style>
</head>

<body>

<h1>🎓 Student Dashboard</h1>
<button onclick="logout()">Logout</button>

<h2>Available Slots</h2>
<div id="slots"></div>

<h2>My Reservations</h2>
<div id="myReservations"></div>

<script>
const API = "http://127.0.0.1:5000";
const socket = io(API);

let user = null;

try {
  user = JSON.parse(localStorage.getItem("user"));
} catch (e) {
  user = null;
}

if (!user || user.role !== "student") {
  window.location = "index.html";
}

/* ---------------- SOCKET ---------------- */
socket.on("slots_updated", () => {
  fetchSlots();
});

socket.on("logs_updated", () => {
  fetchMyReservations();
});

/* ---------------- LOGOUT ---------------- */
function logout(){
  localStorage.clear();
  window.location = "index.html";
}

/* ---------------- SLOTS ---------------- */
async function fetchSlots(){
  let res = await fetch(API + "/slots");
  let data = await res.json();

  let html = "";

  data.forEach(slot => {
    html += `
      <div class="card">
        <b>Slot ${slot.slot_number}</b><br>
        Status: <span class="${slot.status.toLowerCase()}">${slot.status}</span><br>

        ${slot.status === "FREE" ? `
          <button onclick="reserve(${slot.id})">Reserve</button>
        ` : ""}
      </div>
    `;
  });

  document.getElementById("slots").innerHTML = html;
}

/* ---------------- RESERVE ---------------- */
async function reserve(id){
  let res = await fetch(API + "/reserve", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      slot_id: id,
      user_id: user.id,
      role: user.role
    })
  });

  let data = await res.json();
  alert(data.message);
}

/* ---------------- MY RESERVATIONS ---------------- */
async function fetchMyReservations(){
  let res = await fetch(API + "/my_reservations?user_id=" + user.id);
  let data = await res.json();

  let html = "";

  data.forEach(r => {
    html += `
      <div class="card">
        Slot ${r.slot_id}<br>
        <button onclick="cancel(${r.slot_id})">Cancel</button>
      </div>
    `;
  });

  document.getElementById("myReservations").innerHTML = html;
}

/* ---------------- CANCEL ---------------- */

async function cancel(slotId){
  let res = await fetch(API + "/cancel_reservation", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      slot_id: slotId,
      user_id: user.id
    })
  });

  let data = await res.json();
  alert(data.message);

  fetchSlots();
  fetchMyReservations();
}

/* ---------------- INIT ---------------- */
fetchSlots();
fetchMyReservations();
</script>

</body>
</html>
